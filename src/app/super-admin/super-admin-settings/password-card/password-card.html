<form class="tf" [formGroup]="form" (ngSubmit)="save()">
  <h2>Your password</h2>
  <p class="tf__hint">At least 10 characters. Changing it signs you out on every other device.</p>

  <div class="form-field">
    <label for="sa-current-password">Current password</label>
    <input id="sa-current-password" type="password" formControlName="current" autocomplete="current-password" />
  </div>
  <div class="form-field">
    <label for="sa-new-password">New password</label>
    <input id="sa-new-password" type="password" formControlName="next" autocomplete="new-password" />
  </div>
  <div class="form-field">
    <label for="sa-confirm-password">New password again</label>
    <input id="sa-confirm-password" type="password" formControlName="confirm" autocomplete="new-password" />
  </div>

  @if (error()) {
    <p class="form-field__error" role="alert">{{ error() }}</p>
  }
  <button type="submit" class="btn-admin-primary" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Change password' }}</button>
</form>
