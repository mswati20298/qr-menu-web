<button
  type="button"
  class="notification-bell"
  (click)="onClick()"
  aria-label="Order notifications"
>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path
      d="M6 9a6 6 0 0 1 12 0c0 3.5 1 5 1.5 6H4.5C5 14 6 12.5 6 9Z"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linejoin="round"
    />
    <path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
  </svg>

  @if (notifications.unreadCount() > 0) {
    <span class="notification-bell__badge">{{ notifications.unreadCount() > 9 ? '9+' : notifications.unreadCount() }}</span>
  }
</button>
