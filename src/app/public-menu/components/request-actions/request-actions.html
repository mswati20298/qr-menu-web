<section class="request-actions" aria-label="Quick requests">
  <div class="request-actions__row">
    @for (option of options; track option.type) {
      <button
        type="button"
        class="request-actions__btn"
        [class.request-actions__btn--sent]="isSent(option.type)"
        [disabled]="sending() === option.type || isSent(option.type)"
        (click)="send(option.type)"
      >
        <app-icon class="request-actions__icon" [name]="isSent(option.type) ? 'check' : option.icon" [size]="24" />
        <span class="request-actions__label">
          {{ sending() === option.type ? 'Sending…' : isSent(option.type) ? 'Sent' : option.buttonLabel }}
        </span>
      </button>
    }
  </div>

</section>
