<div class="help-sheet__backdrop" (click)="close.emit()">
  <div class="help-sheet__panel" (click)="$event.stopPropagation()">
    <div class="help-sheet__handle"></div>

    <button type="button" class="help-sheet__close" (click)="close.emit()" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <h2 class="help-sheet__title">{{ restaurant().name }}</h2>
    @if (restaurant().tagline) {
      <p class="help-sheet__tagline">{{ restaurant().tagline }}</p>
    }
    <p class="help-sheet__hours">
      <span class="help-sheet__dot" [class.help-sheet__dot--open]="restaurant().isOpenNow"></span>
      {{ restaurant().isOpenNow ? 'Open now' : 'Closed now' }} · {{ formatTime12h(restaurant().openTime) }}–{{ formatTime12h(restaurant().closeTime) }}
    </p>

    <div class="help-sheet__actions">
      <a [href]="callHref" class="help-sheet__action">
        <span class="help-sheet__action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.36 2.3.56 3.5.56a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.4 21 3 13.6 3 4.5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.56 3.5a1 1 0 0 1-.25 1L6.6 10.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        </span>
        Call restaurant
      </a>

      <a [href]="whatsAppHref" target="_blank" rel="noopener" class="help-sheet__action">
        <span class="help-sheet__action-icon help-sheet__action-icon--whatsapp">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3a9 9 0 0 0-7.8 13.4L3 21l4.7-1.2A9 9 0 1 0 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M8.5 8.7c.2-.5.5-.5.8-.5h.6c.2 0 .4 0 .6.4.2.5.7 1.6.7 1.7.1.1.1.3 0 .4-.1.2-.1.3-.3.5l-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.6-.7c.2-.3.4-.2.6-.1l1.5.7c.2.1.4.2.4.3.1.2.1 1-.3 1.4-.3.5-1.5 1-2.5.7-1-.2-3.1-1-4.9-2.9-1.5-1.5-2.4-3.3-2.6-3.8-.2-.5-.2-.5-.2-.6" fill="currentColor" />
          </svg>
        </span>
        WhatsApp
      </a>
    </div>
  </div>
</div>
