<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QR Menu — Digital Menus for Indian Restaurants</title>
  <base href="/">
  <script>
    try { var t = localStorage.getItem('qrmenu_theme'); if (t !== 'dark' && t !== 'light') { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- QRenvo icon: SVG for modern browsers, ICO (16/32/48) as fallback, PNGs for phone home screens. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#1b6b50">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root>
    <!-- Shown until the app starts (Angular replaces it). -->
    <div style="position:fixed;inset:0;display:grid;place-items:center" role="status" aria-label="Loading">
      <span class="boot-ring"></span>
    </div>
    <style>
      .boot-ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(128, 128, 128, 0.22); border-top-color: rgba(128, 128, 128, 0.75); animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-ring { animation-duration: 2.4s; } }
    </style>
  </app-root>
</body>
</html>
